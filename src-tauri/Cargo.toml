[package]
name = "container-manage-center"
description = "Container Manage Center (CMC): administración gráfica de Docker Engine para Linux"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
default-run = "container-manage-center"

[lib]
name = "cmc_app"
# Solo escritorio: sin `cdylib` ni `staticlib` (para móviles), que además
# superan el límite de 65535 exportaciones de MinGW en Windows (D-114).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio-util = { version = "0.7", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
cmc-activity.workspace = true
cmc-store.workspace = true
cmc-engine.workspace = true
uuid.workspace = true
# Comprobación de versiones nuevas (Fase 9, D-060): HTTPS con rustls + ring y
# los certificados del sistema; respeta HTTPS_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
semver = "1"
libc = "0.2"
# Historial de APT rotado (history.log.N.gz) para «Desinstalación y componentes» (0.9.1).
flate2 = "1"
# Abrir el perfil de GitHub del autor desde «Ayuda» (0.9.1): solo esa URL, limitada en capabilities/default.json.
tauri-plugin-opener = "2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# Notificaciones de escritorio por D-Bus (1.5.0); ya estaba en el árbol por el llavero.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Secretos de servidores remotos en el keyring del sistema (0.10.0, D-077): Secret
# Service por D-Bus en Rust puro (zbus), sin bibliotecas nativas nuevas.
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }

# Windows (1.9.0, D-114): secretos en el Administrador de credenciales y
# notificaciones del sistema. Crates de Microsoft que ya estaban en el árbol
# (Tauri los usa); solo se activan sus módulos.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom"] }

[dev-dependencies]
tempfile.workspace = true
# Registro de imágenes de prueba compartido con cmc-engine (descarga real por IPC).
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tauri = { version = "2", features = ["test"] }
