[package]
name = "docker-control-center"
description = "Administración gráfica de Docker Engine para Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "docker-control-center"

[lib]
name = "dcc_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio-util = { version = "0.7", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
dcc-activity.workspace = true
dcc-store.workspace = true
dcc-engine.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Registro de imágenes de prueba compartido con dcc-engine (descarga real por IPC).
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tauri = { version = "2", features = ["test"] }
