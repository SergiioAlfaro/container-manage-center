[package]
name = "docker-control-center"
description = "Administración gráfica de Docker Engine para Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "docker-control-center"

[lib]
name = "dcc_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio-util = { version = "0.7", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
dcc-activity.workspace = true
dcc-store.workspace = true
dcc-engine.workspace = true
# Comprobación de versiones nuevas (Fase 9, D-060): HTTPS con rustls + ring y
# los certificados del sistema; respeta HTTPS_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
semver = "1"
libc = "0.2"
# Historial de APT rotado (history.log.N.gz) para «Desinstalación y componentes» (0.9.1).
flate2 = "1"
# Abrir el perfil de GitHub del autor desde «Ayuda» (0.9.1): solo esa URL, limitada en capabilities/default.json.
tauri-plugin-opener = "2"
# Secretos de servidores remotos en el keyring del sistema (0.10.0, D-077): Secret
# Service por D-Bus en Rust puro (zbus), sin bibliotecas nativas nuevas.
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
# Registro de imágenes de prueba compartido con dcc-engine (descarga real por IPC).
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tauri = { version = "2", features = ["test"] }
