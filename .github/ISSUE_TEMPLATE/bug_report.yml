name: Error
description: Algo no funciona como debería.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **No incluyas contraseñas, claves, tokens ni datos reales** en el issue: usa valores de ejemplo.
        Para problemas de seguridad, usa el aviso privado (SECURITY.md), no un issue.
  - type: input
    id: version
    attributes:
      label: Versión de Container Manage Center
      description: Configuración › Sistema o Ayuda › Acerca de.
      placeholder: "1.9.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Sistema
      options:
        - Debian 13
        - Debian 12
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Windows 11
        - Windows 10
        - Otro
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker
      description: Salida de `docker version --format '{{.Server.Version}}'` y, si se usa, de `docker compose version`. En Windows, versión de Docker Desktop.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde está Docker?
      options:
        - En este equipo
        - En un servidor remoto (SSH)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre …
        2. Pulsa …
        3. Aparece …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué ha pasado
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: Registro de actividad
      description: Si procede, copia la operación del panel de actividad (los secretos ya salen ocultos; revisa que no haya datos privados).
      render: text
