#
# Instalador de Windows con MSVC (1.9.0, D-114; 1.9.1: acciones fijadas por
# commit y permiso adicional de WebView2).
#
# Solo se ejecuta a mano (workflow_dispatch). El cargador de WebView2 de
# Microsoft que lleva el instalador está cubierto por el permiso adicional de
# la GPL v3 §7 (docs/legal/WEBVIEW2_EXCEPTION.md, aprobado el 2026-11-17). El
# instalador se guarda como artefacto de la ejecución; publicar una versión
# (release) es una decisión del titular y se hace a mano. Las pruebas
# unitarias están en ci.yml.
#
# 1.11.1: también se puede llamar desde release-draft.yml (workflow_call).
name: windows-build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  WEBVIEW2_SDK: "1.0.3650.58"

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: cargo fetch --locked

      - name: Licencia original de WebView2Loader (paquete NuGet)
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/${WEBVIEW2_SDK}/microsoft.web.webview2.${WEBVIEW2_SDK}.nupkg"
          curl -fsSL -o webview2.nupkg "$url"
          mkdir -p webview2-nupkg
          unzip -q webview2.nupkg -d webview2-nupkg
          lic=$(find webview2-nupkg -maxdepth 1 -iname 'LICENSE*' | head -1)
          test -n "$lic"
          # Mismo texto salvo espacios y saltos de línea.
          norm() { tr -s '[:space:]' ' ' < "$1" | sed 's/^ //;s/ $//'; }
          if [ "$(norm "$lic")" != "$(norm packaging/windows/licenses/WebView2Loader.LICENSE.txt)" ]; then
            echo "::error::La licencia del paquete NuGet no coincide con packaging/windows/licenses/WebView2Loader.LICENSE.txt"
            diff -u -w packaging/windows/licenses/WebView2Loader.LICENSE.txt "$lic" || true
            exit 1
          fi
          echo "La licencia de WebView2Loader coincide con la del paquete NuGet ${WEBVIEW2_SDK}"

      - name: Avisos de terceros para MSVC
        shell: bash
        env:
          CMC_LICENSE_TARGET: x86_64-pc-windows-msvc
        run: python scripts/third-party-licenses.py --windows

      - name: Compilar el instalador NSIS
        run: npx tauri build --bundles nsis --ci

      - name: Nombre de prueba y sumas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for f in target/release/bundle/nsis/*.exe; do
            cp "$f" "out/$(basename "$f" .exe)-msvc.exe"
          done
          cp docs/legal/THIRD_PARTY_NOTICES-windows.md docs/legal/DEPENDENCY_LICENSE_AUDIT-windows.md out/
          (cd out && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-manage-center-windows
          path: out/
          retention-days: 14
