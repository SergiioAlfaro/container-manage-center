[package]
name = "dcc-engine"
description = "Conexión con Docker Engine: resolución del socket, diagnóstico y cliente API con registro de actividad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
ts-rs.workspace = true
dirs.workspace = true
sha2 = "0.10"
libc = "0.2"
serde_urlencoded = "0.7"
parking_lot.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false }
bytes = "1"
dcc-activity.workspace = true

[dev-dependencies]
tempfile.workspace = true
tar = "0.4"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
